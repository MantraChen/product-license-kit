[package]
name = "product-license-kit-client"
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "PolyForm-Noncommercial-1.0.0"
publish = false

[dependencies]
base64 = "0.22"
ed25519-dalek = { version = "=3.0.0", features = ["pem"] }
getrandom = "0.4"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
rsa = "=0.10.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zeroize = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization", "Win32_Security_Cryptography", "Win32_System_Threading", "Win32_System_SystemInformation"] }
